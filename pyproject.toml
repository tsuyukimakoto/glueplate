[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "glueplate"
version = "1.3.0"
description = "Composable settings for Python frameworks and libraries"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Makoto Tsuyuki", email = "mtsuyuki@gmail.com" },
]
keywords = ["configuration", "settings", "framework"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/tsuyukimakoto/glueplate"
Repository = "https://github.com/tsuyukimakoto/glueplate"
Issues = "https://github.com/tsuyukimakoto/glueplate/issues"

[dependency-groups]
dev = [
  "build>=1.3",
  "pyrefly>=0.42",
  "pytest>=9.0.3",
  "pytest-cov>=7.0",
  "ruff>=0.13",
  "twine>=6.2",
]

[tool.uv]
exclude-newer = "7 days"

[tool.hatch.build.targets.wheel]
packages = ["src/glueplate"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov=src/glueplate --cov-report=term-missing --cov-fail-under=95"
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "SIM", "UP"]

[tool.pyrefly]
project-includes = ["src/**/*.py", "tests/**/*.py"]
search-path = ["src", "tests"]
